include:
    - project: 'hive/common-ci-configuration'
      ref: develop
      file: '/templates/base.gitlab-ci.yml'

stages:
    - test
    - build

variables:
    DOCKER_IMAGE: hiveio/wallet

################################# COMMON TEMPLATES #################################

.docker-job: &docker-job
    image: docker:27
    tags:
        - public-runner-docker
    services:
        - docker:27-dind
    before_script:
        - echo $HUB_TOKEN | docker login -u $HUB_USERNAME --password-stdin

# Node comes from common-ci-configuration's node-test-tools, which has no yarn.
.yarn-job: &yarn-job
    image: ${NODE_TEST_TOOLS_IMAGE}
    tags:
        - public-runner-docker
    before_script:
        - npm install -g --no-fund --no-audit yarn@1.22.22
        - yarn install --frozen-lockfile

################################# TESTS #################################

run-unit-tests:
    <<: *yarn-job
    stage: test
    only:
        - branches
        - merge_requests
    script:
        - yarn run ci:test
    coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/

run-eslint:
    <<: *yarn-job
    stage: test
    only:
        - branches
        - merge_requests
    script:
        - yarn ci:eslint

################################# IMAGE BUILDING #################################

build-development:
    <<: *docker-job
    stage: build
    variables:
        DOCKER_TAG: $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
        DOCKER_TAG_MAIN: $DOCKER_IMAGE:development
        SOURCE_COMMIT: $CI_COMMIT_SHA
    only:
        - develop
    script:
        - docker build -t $DOCKER_TAG -t $DOCKER_TAG_MAIN --build-arg SOURCE_COMMIT --build-arg DOCKER_TAG --build-arg NODE_VERSION=$NODE_IMAGE_VERSION .
        - docker push $DOCKER_TAG
        - docker push $DOCKER_TAG_MAIN

build-production:
    <<: *docker-job
    stage: build
    variables:
        DOCKER_TAG: $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
        DOCKER_TAG_MAIN: $DOCKER_IMAGE:latest
        SOURCE_COMMIT: $CI_COMMIT_SHA
    only:
        - master
    script:
        - docker build -t $DOCKER_TAG -t $DOCKER_TAG_MAIN --build-arg SOURCE_COMMIT --build-arg DOCKER_TAG --build-arg NODE_VERSION=$NODE_IMAGE_VERSION .
        - docker push $DOCKER_TAG
        - docker push $DOCKER_TAG_MAIN
