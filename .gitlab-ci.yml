include:
    - project: 'hive/common-ci-configuration'
      ref: develop
      file: '/templates/base.gitlab-ci.yml'

stages:
    - test
    - build

variables:
    DOCKER_IMAGE: hiveio/wallet
    # The on-site npm cache (genfiles), the same value common-ci-configuration's
    # docker_image_jobs template sets; npm falls back to the public registry when empty.
    NPM_CONFIG_REGISTRY: "http://npm-cache.syncad.com:8080/"

################################# COMMON TEMPLATES #################################

.docker-job: &docker-job
    image: docker:27
    tags:
        - public-runner-docker
    services:
        - docker:27-dind
    before_script:
        - echo $HUB_TOKEN | docker login -u $HUB_USERNAME --password-stdin

# Node and npm come from common-ci-configuration's node-test-tools.
.npm-job: &npm-job
    image: ${NODE_TEST_TOOLS_IMAGE}
    tags:
        - public-runner-docker
    before_script:
        - npm ci --no-audit --no-fund

################################# TESTS #################################

run-unit-tests:
    <<: *npm-job
    stage: test
    only:
        - branches
        - merge_requests
    script:
        - npm run ci:test
    coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/

run-eslint:
    <<: *npm-job
    stage: test
    only:
        - branches
        - merge_requests
    script:
        - npm run ci:eslint

################################# IMAGE BUILDING #################################

# Builds the production image on merge requests without pushing, so a Dockerfile
# change is built before it lands on develop. No registry login (no HUB_* needed).
build-image-smoke:
    <<: *docker-job
    before_script: []
    stage: build
    variables:
        DOCKER_TAG: $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
        SOURCE_COMMIT: $CI_COMMIT_SHA
    only:
        - merge_requests
    script:
        - docker build -t $DOCKER_TAG --build-arg SOURCE_COMMIT --build-arg DOCKER_TAG --build-arg NODE_VERSION=$NODE_IMAGE_VERSION --build-arg NPM_CONFIG_REGISTRY .

build-development:
    <<: *docker-job
    stage: build
    variables:
        DOCKER_TAG: $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
        DOCKER_TAG_MAIN: $DOCKER_IMAGE:development
        SOURCE_COMMIT: $CI_COMMIT_SHA
    only:
        - develop
    script:
        - docker build -t $DOCKER_TAG -t $DOCKER_TAG_MAIN --build-arg SOURCE_COMMIT --build-arg DOCKER_TAG --build-arg NODE_VERSION=$NODE_IMAGE_VERSION --build-arg NPM_CONFIG_REGISTRY .
        - docker push $DOCKER_TAG
        - docker push $DOCKER_TAG_MAIN

build-production:
    <<: *docker-job
    stage: build
    variables:
        DOCKER_TAG: $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
        DOCKER_TAG_MAIN: $DOCKER_IMAGE:latest
        SOURCE_COMMIT: $CI_COMMIT_SHA
    only:
        - master
    script:
        - docker build -t $DOCKER_TAG -t $DOCKER_TAG_MAIN --build-arg SOURCE_COMMIT --build-arg DOCKER_TAG --build-arg NODE_VERSION=$NODE_IMAGE_VERSION --build-arg NPM_CONFIG_REGISTRY .
        - docker push $DOCKER_TAG
        - docker push $DOCKER_TAG_MAIN
